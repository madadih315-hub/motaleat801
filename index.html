0627\u062A \u062E\u06CC\u0631\u06CC\u0647 \u062A\u0634\u06A9\u06CC\u0644 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F. \u0627\u06CC\u0646 \u0633\u0627\u0632\u0645\u0627\u0646\u200C\u0647\u0627 \u0628\u0627 \u062C\u0645\u0639\u200C\u0622\u0648\u0631\u06CC \u06A9\u0645\u06A9\u200C\u0647\u0627\u06CC \u0645\u0631\u062F\u0645\u060C \u062F\u0631 \u0632\u0645\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC\u06CC \u0645\u0627\u0646\u0646\u062F \u062A\u0647\u06CC\u0647 \u063A\u0630\u0627\u060C \u067E\u0648\u0634\u0627\u06A9\u060C \u062F\u0631\u0645\u0627\u0646 \u0648 \u0622\u0645\u0648\u0632\u0634 \u0628\u0647 \u0627\u0641\u0631\u0627\u062F \u0646\u06CC\u0627\u0632\u0645\u0646\u062F \u06A9\u0645\u06A9 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F.","\u062E\u06CC\u0631\u06CC\u0646 \u0645\u062F\u0631\u0633\u0647\u200C\u0633\u0627\u0632 \u0646\u06CC\u0632 \u0628\u0627 \u06A9\u0645\u06A9 \u0645\u0627\u0644\u06CC \u062E\u0648\u062F \u062F\u0631 \u0633\u0627\u062E\u062A \u06CC\u0627 \u062A\u0639\u0645\u06CC\u0631 \u0645\u062F\u0631\u0633\u0647\u200C\u0647\u0627 \u0645\u0634\u0627\u0631\u06A9\u062A \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F."]},{id:"l2-waqf",title:"\u0648\u0642\u0641 \u0648 \u0645\u0648\u0642\u0648\u0641\u0627\u062A",paragraphs:["\u0648\u0642\u0641 \u06CC\u06A9\u06CC \u0627\u0632 \u0631\u0648\u0634\u200C\u0647\u0627\u06CC \u06A9\u0645\u06A9 \u0628\u0647 \u062C\u0627\u0645\u0639\u0647 \u0627\u0633\u062A. \u062F\u0631 \u0648\u0642\u0641\u060C \u0634\u062E\u0635 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0645\u0627\u0644 \u06CC\u0627 \u062F\u0627\u0631\u0627\u06CC\u06CC \u062E\u0648\u062F \u0631\u0627 \u0628\u0631\u0627\u06CC \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u062F\u0631 \u06A9\u0627\u0631\u0647\u0627\u06CC \u062E\u06CC\u0631 \u0648 \u0627\u0647\u062F\u0627\u0641 \u0645\u0634\u062E\u0635 \u0627\u062E\u062A\u0635\u0627\u0635 \u0645\u06CC\u200C\u062F\u0647\u062F.","\u0628\u0647 \u0627\u0645\u0648\u0627\u0644\u06CC \u06A9\u0647 \u0648\u0642\u0641 \u0634\u062F\u0647\u200C\u06 627\u0631\u062F."]}],glossary:[{term:"\u0627\u0646\u0641\u0627\u0642",definition:"\u0628\u062E\u0634\u06CC\u062F\u0646 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0645\u0627\u0644 \u0648 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0628\u0631\u0627\u06CC \u06A9\u0645\u06A9 \u0628\u0647 \u062F\u06CC\u06AF\u0631\u0627\u0646 \u0648 \u0627\u0646\u062C\u0627\u0645 \u06A9\u0627\u0631\u0647\u0627\u06CC \u0646\u06CC\u06A9."},{term:"\u0633\u0627\u0632\u0645\u0627\u0646 \u062E\u06CC\u0631\u06CC\u0647",definition:"\u0633\u0627\u0632\u0645\u0627\u0646 \u06CC\u0627 \u0645\u0624\u0633\u0633\u0647\u200C\u0627\u06CC \u06A9\u0647 \u0627\u0641\u0631\u0627\u062F \u0628\u0631\u0627\u06CC \u06A9\u0645\u06A9 \u0628\u0647 \u0646\u06CC\u0627\u0632\u0645\u0646\u062F\u0627\u0646 \u0648 \u062D\u0644 \u0645\u0634\u06A9\u0644\u0627\u062A \u0645\u0631\u062F\u0645 \u062A\u0634\u06A9\u06CC\u0644 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F."},{term:"\u062E\u06CC\u0631\u06CC\u0646 \u0645\u062F\u0631\u0633\u0647\u200C\u0633\u0627\u0632",definition:"\u0627\u0641\u0631\u0627\u062F\u06CC \u06A9\u0647 \u0628\u0627 \u06A9\u0645\u06A9 \u0645\u0627\u0644\u06CC \u062E\u0648\u062F \u062F\u0631 \u0633\u0627\u062E\u062A \u06CC\u0627 \u062A\u0639\u0645\u06CC\u0631 \u0645\u062F\u0631\u0633\u0647\u200C\u0647\u0627 \u0645\u0634\u0627\u0631\u06A9\u062A \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F."},{term:"\u0648\u0642\u0641",definition:"\u0627\u062E\u062A\u0635\u0627\u0635 \u062F\u0627\u062F\u0646 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0645\u0627\u0644 \u06CC\u0627 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0628\u0631\u0627\u06CC \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u062F\u0631 \u06A9\u0627\u0631\u0647\u0627\u06CC \u062E\u06CC\u0631 \u0648 \u0627\u0647\u062F\u0627\u0641 \u0645\u0634\u062E\u0635."},{term:"\u0645\u0648\u0642\u0648\u0641\u0627\u062A",definition:"\u0627\u0645\u0648\u0627\u0644\u06CC \u06A9\u0647 \u0648\u0642\u0641 \u0634\u062F\u0647\u200C\u0627\u0646\u062F."},{term:"\u0634\u0631\u06A9\u062A \u062A\u0639\u0627\u0648\u0646\u06CC",definition:"\u0633\u0627\u0632\u0645\u0627\u0646\u06CC \u06A9\u0647 \u0627\u0641\u0631\u0627\u062F \u0628\u0627 \u0647\u0645\u06A9\u0627\u0631\u06CC \u0648 \u0645\u0634\u0627\u0631\u06A9\u062A \u06CC\u06A9\u062F\u06CC\u06AF\u0631 \u0622\u0646 \u0631\u0627 \u062A\u0634\u06A9\u06CC\u0644 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F \u062A\u0627 \u0646\u06CC\u0627\u0632\u0647\u0627\u06CC \u0645\u0634\u062A\u0631\u06A9 \u062E\u0648\u062F \u0631\u0627 \u0628\u0631\u0637\u0631\u0641 \u06A9\u0646\u0646\u062F."}],examples:["\u062A\u0639\u0627\u0648\u0646 \u062F\u0631 \u0645\u062F\u0631\u0633\u0647: \u0641\u0639\u0627\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u06AF\u0631\u0648\u0647\u06CC\u060C \u0645\u0631\u062A\u0628 \u0646\u06AF\u0647\u200C\u062F\u0627\u0634\u062A\u0646 \u06A9\u0644\u0627\u0633\u060C \u0645\u0631\u0627\u0642\u0628\u062A \u0627\u0632 \u0648\u0633\u0627\u06CC\u0644 \u0645\u062F\u0631\u0633\u0647\u060C \u06A9\u0645\u06A9 \u0628\u0647 \u0647\u0645\u200C\u06A9\u0644\u0627\u0633\u06CC\u200C\u0647\u0627","\u062A\u0639\u0627\u0648\u0646 \u062F\u0631 \u0645\u062D\u0644\u0647: \u062A\u0645\u06CC\u0632 \u0646\u06AF\u0647\u200C\u062F\u0627\u0634\u062A\u0646 \u06A9\u0648\u0686\u0647\u200C\u0647\u0627 \u0648 \u062E\u06CC\u0627\u0628\u0627\u0646\u200C\u0647\u0627\u060C \u0645\u0631\u0627\u0642\u0628\u062A \u0627\u0632 \u0641\u0636\u0627\u06CC \u0633\u0628\u0632\u060C \u06A9\u0645\u06A9 \u0628\u0647 \u0647\u0645\u0633\u0627\u06CC\u06AF\u0627\u0646","\u0627\u0646\u0641\u0627\u0642: \u06A9\u0645\u06A9 \u0645\u0627\u0644\u06CC\u060C \u062A\u0647\u06CC\u0647\u0654 \u063A\u0630\u0627\u060C \u0644\u0628\u0627\u0633 \u06CC\u0627 \u0648\u0633\u0627\u06CC\u0644 \u0645\u0648\u0631\u062F\u0646\u06CC\u0627\u0632 \u0646\u06CC\u0627\u0632\u0645\u0646\u062F\u0627\u0646","\u0645\u0648\u0642\u0648\u0641\u0627\u062A: \u0633\u0627\u062E\u062A \u0645\u062F\u0631\u0633\u0647\u060C \u0645\u0633\u062C\u062F\u060C \u0628\u06CC\u0645\u0627\u0631\u0633\u062A\u0627\u0646 \u0648 \u062F\u06CC\u06AF\u0631 \u06A9\u0627\u0631\u0647\u0627\u06CC \u0639\u0645\u0648\u0645\u06CC"],examTips:["\u0627\u0646\u0641\u0627\u0642 \u06CC\u0639\u0646\u06CC \u0628\u062E\u0634\u06CC\u062F\u0646 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0645\u0627\u0644 \u0648 \u062F\u0627\u0631\u0627\u06CC\u06CC \u0628\u0631\u0627\u06CC \u06A9\u0645\u06A9 \u0628\u0647 \u062F\u06CC\u06AF\u0631\u0627\u0646 \u0648 \u0627\u0646\u062C\u0627\u0645 \u06A9\u0627\u0631\u0647\u0627\u06CC \u0646\u06CC\u06A9.","\u0622\u06CC\u0647\u0654 \u06F9\u06F2 \u0633\u0648\u0631\u0647\u0654 \u0622\u0644\u200C\u0639\u0645\u0631\u0627\u0646: \u0628\u0631\u0627\u06CC \u0631\u0633\u06CC\u062F\u0646 \u0628\u0647 \u0646\u06CC\u06A9\u06CC \u0648\u0627\u0642\u0639\u06CC \u0628\u0627\u06CC\u062F \u0627\u0632 \u0686\u06CC\u0632\u0647\u0627\u06CC\u06CC \u06A9\u0647 \u062F\u0648\u0633\u062A \u062F\u0627\u0631\u06CC\u0645 \u0627\u0646\u0641\u0627\u0642 \u06A9\u0646\u06CC\u0645.","\u0633\u0627\u0632\u0645\u0627\u0646\u200C\u0647\u0627\u06CC \u062E\u06CC\u0631\u06CC\u0647 \u0628\u0627 \u062C\u0645\u0639\u200C\u0622\u0648\u0631\u06CC \u06A9\u0645\u06A9\u200C\u0647\u0627\u06CC \u0645\u0631\u062F\u0645 \u0628\u0647 \u0646\u06CC\u0627\u0632\u0645\u0646\u062F\u0627\u0646 \u063A\u0630\u0627\u060C \u067E\u0648\u0634\u0627\u06A9\u060C \u062F\u0631\u0645\u0627\u0646 \u0648 \u0622\u0645\u0648\u0632\u0634 \u0645\u06CC\u200C\u0631\u0633\u0627\u0646\u0646\u062F.","\u062E\u06CC\u0631\u06CC\u0646 \u0645\u062F\u0631\u0633\u0647\u200C\u0633\u0627\u0632 \u062F\u0631 \u0633\u0627\u062E\u062A \u06CC\u0627 \u062A\u0639\u0645\u06CC\u0631 \u0645\u062F\u0631\u0633\u0647\u200C\u0647\u0627 \u0645\u0634\u0627\u0631\u06A9\u062A \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F.","\u0648\u0642\u0641 = \u0627\u062E\u062A\u0635\u0627\u0635 \u0628\u062E\u0634\u06CC \u0627\u0632 \u0645\u0627\u0644 \u0628\u0631\u0627\u06CC \u06A9\u0627\u0631\u0647\u0627\u06CC \u062E\u06CC\u0631 \u0648 \u0627\u0647\u062F\u0627\u0641 \u0645\u0634\u062E\u0635\u061B \u0627\u0645\u0648\u0627\u0644 \u0648\u0642\u0641\u200C\u0634\u062F\u0647 = \u0645\u0648\u0642\u0648\u0641\u0627\u062A.","\u062F\u0631 \u0634\u0631\u06A9\u062A \u062A\u0639\u0627\u0648\u0646\u06CC \u0627\u0635\u0644 \u0628\u0631\u0627\u0628\u0631\u06CC \u0627\u0639\u0636\u0627 \u0645\u0647\u0645 \u0627\u0633\u062A \u0648 \u0647\u0631 \u0639\u0636\u0648 \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u06CC\u06A9 \u0631\u0623\u06CC \u062F\u0627\u0631\u062F."],goldenSummary:["\u062A\u0639\u0627\u0648\u0646 \u0631\u0627 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646 \u062F\u0631 \u0645\u062F\u0631\u0633\u0647\u060C \u0645\u062D\u0644\u0647 \u0648 \u062C\u0627\u0645\u0639\u0647 \u062A\u0645\u0631\u06CC\u0646 \u06A9\u0631\u062F.","\u0627\u0646\u0641\u0627\u0642\u060C \u0633\u0627\u0632\u0645\u0627\u0646\u200C\u0647\u0627\u06CC \u062E\u06CC\u0631\u06CC\u0647 \u0648 \u0648\u0642\u0641 \u0633\u0647 \u0631\u0627\u0647 \u06A9\u0645\u06A9 \u0628\u0647 \u0646\u06CC\u0627\u0632\u0645\u0646\u062F\u0627\u0646 \u0648 \u062C\u0627\u0645\u0639\u0647\u200C\u0627\u0646\u062F.","\u0645\u0648\u0642\u0648\u0641\u0627\u062A \u0628\u0631\u0627\u06CC \u0633\u0627\u062E\u062A \u0645\u062F\u0631\u0633\u0647\u060C \u0645\u0633\u062C\u062F\u060C \u0628\u06CC\u0645\u0627\u0631\u0633\u062A\u0627\u0646 \u0648 \u06A9\u0627\u0631\u0647\u0627\u06CC \u0639\u0645\u0648\u0645\u06CC \u0628\u0647 \u06A9\u0627\u0631 \u0645\u06CC\u200C\u0631\u0648\u0646\u062F.","\u0634\u0631\u06A9\u062A \u062A\u0639\u0627\u0648\u0646\u06CC \u0631\u0627 \u0627\u0639\u0636\u0627 \u0628\u0627 \u0647\u0645\u06A9\u0627\u0631\u06CC \u0645\u06CC\u200C\u0633\u0627\u0632\u0646\u062F \u0648 \u0647\u0631 \u0639\u0636\u0648 \u0645\u0639\u0645\u0648\u0644\u0627\u064B \u06CC\u06A9 \u0631\u0623\u06CC \u062F\u0627\u0631\u062F."]},{id:"lesson-3",number:3,title:"\u0642\u0648\u0651\u0647\u0654 \u0645\u062C\u0631\u06CC\u0651\u0647 \u0648 \u062F\u0648\u0644\u062A",tagline:"\u0633\u0647 \u0642\u0648\u0651\u0647\u060C \u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u06  \u0628\u0631 \u0639\u0647\u062F\u0647 \u062F\u0627\u0631\u062F.","\u0642\u0648\u0651\u0647\u0654 \u0645\u062C\u0631\u06CC\u0651\u0647: \u0648\u0638\u06CC\u0641\u0647 \u0627\u062C\u0631\u0627\u06CC \u0642\u0648\u0627\u0646\u06CC\u0646 \u0648 \u0627\u062F\u0627\u0631\u0647 \u0627\u0645\u0648\u0631 \u0627\u062C\u0631\u0627\u06CC\u06CC \u06A9\u0634\u0648\u0631 \u0631\u0627 \u0628\u0631 \u0639\u0647\u062F\u0647 \u062F\u0627\u0631\u062F."]},{id:"l3-president",title:"\u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631",paragraphs:["\u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631 \u0631\u06CC\u0627\u0633\u062A \u0642\u0648\u0651\u0647\u0654 \u0645\u062C\u0631\u06CC\u0651\u0647 \u0631\u0627 \u0628\u0631 \u0639\u0647\u062F\u0647 \u062F\u0627\u0631\u062F. \u0627\u0648 \u067E\u0633 \u0627\u0632 \u0645\u0642\u0627\u0645 \u0631\u0647\u0628\u0631\u06CC\u060C \u0639\u0627\u0644\u06CC\u200C\u062A\u0631\u06CC\u0646 \u0645\u0642\u0627\u0645 \u0631\u0633\u0645\u06CC \u06A9\u0634\u0648\u0631 \u0627\u0633\u062A.","\u0627\u0632 \u0645\u0633\u0626\u0648\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646 \u0628\u0647 \u0627\u062C\u0631\u0627\u06CC \u0642\u0627\u0646\u0648\u0646 \u0627\u0633\u0627\u0633\u06CC\u060C \u0627\u062C\u0631\u0627\u06CC \u0642\u0648\u0627\u0646\u06CC\u0646 \u0645\u0635\u0648\u0628 \u0645\u062C\u0644\u0633 \u062F\u0631 \u0645\u062D\u062F\u0648\u062F\u0647 \u0648\u0638\u0627\u06CC\u0641 \u062F\u0648\u0644\u062A \u0648 \u0627\u062F\u0627\u0631\u0647 \u0627\u0645\u0648\u0631 \u0627\u062C\u0631\u0627\u06CC\u06CC \u06A9\u0634\u0648\u0631 \u0627\u0634\u0627\u0631\u0647 \u06A9\u0631\u062F."]},{id:"l3-election",title:"\u0627\u0646\u062A\u062E\u0627\u0628 \u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631\u061B \u062A\u0646\u0641\u06CC\u0630 \u0648 \u062A\u062D\u0644\u06CC\u0641",paragraphs:["\u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u06 net",title:"\u0647\u06CC\u0626\u062A \u062F\u0648\u0644\u062A \u0648 \u0631\u0623\u06CC \u0627\u0639\u062A\u0645\u0627\u062F",paragraphs:["\u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631 \u0648 \u0648\u0632\u06CC\u0631\u0627\u0646\u060C \u0647\u06CC\u0626\u062A \u062F\u0648\u0644\u062A \u0631\u0627 \u062A\u0634\u06A9\u06CC\u0644 \u0645\u06CC\u200C\u062F\u0647\u0646\u062F. \u0648\u0632\u06CC\u0631\u0627\u0646 \u067E\u06CC\u0634\u0646\u0647\u0627\u062F\u06CC \u0628\u0631\u0627\u06CC \u0622\u063A\u0627\u0632 \u0641\u0639\u0627\u0644\u06CC\u062A \u062E\u0648\u062F \u0628\u0627\u06CC\u062F \u0637\u0628\u0642 \u0642\u0627\u0646\u0648\u0646 \u0627\u0632 \u0645\u062C\u0644\u0633 \u0634\u0648\u0631\u0627\u06CC \u0627\u0633\u0644\u0627\u0645\u06CC \u0631\u0623\u06CC \u0627\u0639\u062A\u0645\u0627\u062F \u0628\u06AF\u06CC\u0631\u0646\u062F."]}],glossary:[{term:"\u0642\u0648\u0651\u0647\u0654 \u0645\u0642\u0646\u0646\u0647",definition:"\u0642\u0648\u0651\u0647\u200C\u0627\u06CC \u06A9\u0647 \u0648\u0638\u06CC\u0641\u0647\u0654 \u0642\u0627\u0646\u0648\u0646\u200C\u06AF\u0630\u0627\u0631\u06CC \u0631\u0627 \u0628\u0631 \u0639\u0647\u062F\u0647 \u062F\u0627\u0631\u062F."},{term:"\u0642\u0648\u0651\u0647\u0654 \u0642\u0636\u0627\u0626\u06CC\u0647",definition:"\u0642\u0648\u0651\u0647\u200C\u0627\u06CC \u06A9\u0647 \u0648\u0638\u06CC\u0641\u0647\u0654 \u0631\u0633\u06CC\u062F\u06AF\u06CC \u0628\u0647 \u0627\u062E\u062A\u0644\u0627\u0641\u0627\u062A \u0648 \u0627\u062C\u0631\u0627\u06CC \u0639\u062F\u0627\u0644\u062A \u0631\u0627 \u0628\u0631 \u0639\u0647\u062F\u0647 \u062F\u0627\u0631\u062F."},{term:"\u0642\u0648\u0651\u0647\u0654 \u0645\u062C\u0631\u06CC\u0651\u0647",definition:"\u0647\u0645\u0627\u0646 \u062F\u0648\u0644\u062A \u0648 \u0633\u0627\u0632\u0645\u0627\u0646\u200C\u0647\u0627\u06CC \u0648\u0627\u0628\u0633\u062A\u0647 \u0628\u0647 \u062F\u0648\u0644\u062A\u061B \u0648\u0638\u06CC\u0641\u0647\u0654 \u0627\u062C\u0631\u0627\u06CC \u0642\u0648\u0627\u0646\u06CC\u0646 \u0648 \u0627\u062F\u0627\u0631\u0647 \u0627\u0645\u0648\u0631 \u0627\u062C\u0631\u0627\u06CC\u06CC \u06A9\u0634\u0648\u0631 \u0631\u0627 \u0628\u0631 \u0639\u0647\u062F\u0647 \u062F\u0627\u0631\u062F."},{term:"\u062A\u0646\u0641\u06CC\u0630",definition:"\u062A\u0623\u06CC\u06CC\u062F \u0631\u0633\u0645\u06CC \u062D\u06A9\u0645 \u0631\u06CC\u0627\u0633\u062A\u200C\u062C\u0645\u0647\u0648\u0631\u06CC \u062A\u0648\u0633\u0637 \u0645\u0642\u0627\u0645 \u0631\u0647\u0628\u0631\u06CC."},{term:"\u062A\u062D\u0644\u06CC\u0641",definition:"\u0645\u0631\u0627\u0633\u0645 \u0633\u0648\u06AF\u0646\u062F \u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631."},{term:"\u0647\u06CC\u0626\u062A \u062F\u0648\u0644\u062A",definition:"\u0645\u062C\u0645\u0648\u0639\u0647\u0654 \u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631 \u0648 \u0648\u0632\u06CC\u0631\u0627\u0646."},{term:"\u0631\u0623\u06CC \u0627\u0639\u062A\u0645\u0627\u062F",definition:"\u0631\u0623\u06CC\u06CC \u06A9\u0647 \u0648\u0632\u06CC\u0631\u0627\u0646 \u067E\u06CC\u0634\u0646\u0647\u0627\u062F\u06CC \u0628\u0631\u0627\u06CC \u0622\u063A\u0627\u0632 \u0641\u0639\u0627\u0644\u06CC\u062A \u062E\u0648\u062F \u0628\u0627\u06CC\u062F \u0637\u0628\u0642 \u0642\u0627\u0646\u0648\u0646 \u0627\u0632 \u0645\u062C\u0644\u0633 \u0634\u0648\u0631\u0627\u06CC \u0627\u0633\u0644\u0627\u0645\u06CC \u0628\u06AF\u06CC\u0631\u0646\u062F."}],examples:["\u0642\u0627\u0646\u0648\u0646\u200C\u06AF\u0630\u0627\u0631\u06CC \u2190 \u0648\u0638\u06CC\u0641\u0647\u0654 \u0642\u0648\u0651\u0647\u0654 \u0645\u0642\u0646\u0646\u0647","\u0631\u0633\u06CC\u062F\u06AF\u06CC \u0628\u0647 \u0627\u062E\u062A\u0644\u0627\u0641\u0627\u062A \u0648 \u0627\u062C\u0631\u0627\u06CC \u0639\u062F\u0627\u0644\u062A \u2190 \u0648\u0638\u06CC\u0641\u0647\u0654 \u0642\u0648\u0651\u0647\u0654 \u0642\u0636\u0627\u0626\u06CC\u0647","\u0627\u062C\u0631\u0627\u06CC \u0642\u0648\u0627\u0646\u06CC\u0646 \u0648 \u0627\u062F\u0627\u0631\u0647 \u0627\u0645\u0648\u0631 \u0627\u062C\u0631\u0627\u06CC\u06CC \u06A9\u0634\u0648\u0631 \u2190 \u0648\u0638\u06CC\u0641\u0647\u0654 \u0642\u0648\u0651\u0647\u0654 \u0645\u062C\u0631\u06CC\u0651\u0647","\u0627\u062C\u0631\u0627\u06CC \u0642\u0627\u0646\u0648\u0646 \u0627\u0633\u0627\u0633\u06CC \u0648 \u0642\u0648\u0627\u0646\u06CC\u0646 \u0645\u0635\u0648\u0628 \u0645\u062C\u0644\u0633 \u2190 \u0627\u0632 \u0645\u0633\u0626\u0648\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631"],examTips:["\u0633\u0647 \u0642\u0648\u0651\u0647: \u0645\u0642\u0646\u0646\u0647 (\u0642\u0627\u0646\u0648\u0646\u200C\u06AF\u0630\u0627\u0631\u06CC)\u060C \u0642\u0636\u0627\u0626\u06CC\u0647 (\u0631\u0633\u06CC\u062F\u06AF\u06CC \u0628\u0647 \u0627\u062E\u062A\u0644\u0627\u0641\u0627\u062A \u0648 \u0627\u062C\u0631\u0627\u06CC \u0639\u062F\u0627\u0644\u062A)\u060C \u0645\u062C\u0631\u06CC\u0651\u0647 (\u0627\u062C\u0631\u0627\u06CC \u0642\u0648\u0627\u0646\u06CC\u0646).","\u0633\u0647 \u0642\u0648\u0651\u0647 \u0632\u06CC\u0631 \u0646\u0638\u0631 \u0645\u0642\u0627\u0645 \u0631\u0647\u0628\u0631\u06CC \u0641\u0639\u0627\u0644\u06CC\u062A \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F.","\u0642\u0648\u0651\u0647\u0654 \u0645\u062C\u0631\u06CC\u0651\u0647 \u0647\u0645\u0627\u0646 \u062F\u0648\u0644\u062A \u0648 \u0633\u0627\u0632\u0645\u0627\u0646\u200C\u0647\u0627\u06CC \u0648\u0627\u0628\u0633\u062A\u0647 \u0628\u0647 \u062F\u0648\u0644\u062A \u0627\u0633\u062A.","\u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631 \u0631\u06CC\u0627\u0633\u062A \u0642\u0648\u0651\u0647\u0654 \u0645\u062C\u0631\u06CC\u0651\u0647 \u0631\u0627 \u062F\u0627\u0631\u062F \u0648 \u067E\u0633 \u0627\u0632 \u0631\u0647\u0628\u0631\u06CC \u0639\u0627\u0644\u06CC\u200C\u062A\u0631\u06CC\u0646 \u0645\u0642\u0627\u0645 \u0631\u0633\u0645\u06CC \u06A9\u0634\u0648\u0631 \u0627\u0633\u062A.","\u062A\u0646\u0641\u06CC\u0630 = \u062A\u0623\u06CC\u06CC\u062F \u062D\u06A9\u0645 \u0631\u06CC\u0627\u0633\u062A\u200C\u062C\u0645\u0647\u0648\u0631\u06CC \u062A\u0648\u0633\u0637 \u0631\u0647\u0628\u0631\u06CC\u061B \u062A\u062D\u0644\u06CC\u0641 = \u0645\u0631\u0627\u0633\u0645 \u0633\u0648\u06AF\u0646\u062F \u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631.","\u0647\u06CC\u0626\u062A \u062F\u0648\u0644\u062A = \u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631 + \u0648\u0632\u06CC\u0631\u0627\u0646\u061B \u0648\u0632\u06CC\u0631\u0627\u0646 \u067E\u06CC\u0634\u0646\u0647\u0627\u062F\u06CC \u0628\u0627\u06CC\u062F \u0627\u0632 \u0645\u062C\u0644\u0633 \u0631\u0623\u06CC \u0627\u0639\u062A\u0645\u0627\u062F \u0628\u06AF\u06CC\u0631\u0646\u062F."],goldenSummary:["\u062D\u06A9\u0648\u0645\u062A \u06A9\u0634\u0648\u0631 \u0645\u0627 \u062C\u0645\u0647\u0648\u0631\u06CC \u0627\u0633\u0644\u0627\u0645\u06CC \u0627\u0633\u062A \u0648 \u0633\u0647 \u0642\u0648\u0651\u0647 \u0632\u06CC\u0631 \u0646\u0638\u0631 \u0631\u0647\u0628\u0631\u06CC \u06A9\u0627\u0631 \u0645\u06CC\u200C\u06A9\u0646\u0646\u062F.","\u0642\u0648\u0651\u0647\u0654 \u0645\u062C\u0631\u06CC\u0651\u0647 = \u062F\u0648\u0644\u062A\u061B \u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631 \u0631\u0626\u06CC\u0633 \u0622\u0646 \u0627\u0633\u062A.","\u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631 \u0628\u0627 \u0631\u0623\u06CC \u0645\u0631\u062F\u0645 \u0627\u0646\u062A\u062E\u0627\u0628 \u0645\u06CC\u200C\u0634\u0648\u062F\u061B \u062D\u06A9\u0645 \u0627\u0648 \u062A\u0646\u0641\u06CC\u0630 \u0648 \u0633\u0648\u06AF\u0646\u062F\u0634 \u062A\u062D\u0644\u06CC\u0641 \u0627\u0633\u062A.","\u0631\u0626\u06CC\u0633\u200C\u062C\u0645\u0647\u0648\u0631 \u0648\u0632\u06CC\u0631\u0627\u0646 \u0631\u0627 \u0645\u0639\u0631\u0641\u06CC \u0645\u06CC\u200C\u06A9\u0646\u062F \u0648 \u0622\u0646\u200C\u0647\u0627 \u0628\u0627\u06CC\u062F \u0627\u0632 \u0645\u062C\u0644\u0633 \u0631\u0623\u06CC \u0627\u0639\u062A\u0645\u0627\u062F \u0628\u06AF\u06CC\u0631\u0646\u062F."]},{id:"lesson-4",number:4,title:"\u062F\u0648\u0644\u062A \u0648 \u0634\u0647\u0631\u0648\u0646\u062F\u0627\u0646",tagline:"\u062D\u0642\u0648\u0642 \u0648 \u0645\u0633\u0626\u0648\u0644\u06CC\u062A\u200C\u0647\u0627\u060C \u0645\u062C\u0644\u0633 \u0648 \u062F\u0648\u0644\u062A\u060C \u062F\u0631\u0622\u0645\u062F \u0648 \u0628\u0648\u062F\u062C\u0647",accent:"indigo",sections:[{id:"l4-citizen",title:"\u0634\u0647\u0631\u0648\u0646\u062F",paragraphs:["\u0634\u0647\u0631\u0648\u0646\u062F \u0641\u0631\u062F\u06CC \u0627\u0633\u062A \u06A9\u0647 \u0639\u0636\u0648 \u06CC\u06A9 \u06A9\u0634\u0648\u0631 \u0645\u062D\u0633\u0648\u0628 \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u062F\u0631 \u0628\u0631\u0627\u0628\u0631 \u0622\u0646 \u06A9\u0634\u0648\u0631 \u062D\u0642\u0648\u0642 \u0648 \u0645\u0633\u0626\u0648\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC\u06CC \u062F\u0627\u0631\u062F."]},{id:"l4-rights",title:"\u062D\u0642\u0648\u0642 \u0634\u0647\u0631\u0648\u0646\u062F\u0627\u0646",paragraphs:["\u062D\u0642\u0648\u0642 \u0634\u0647\u0631\u0648\u0646\u062F\u06CC \u0628\u0647 \u0627\u0645\u06A9\u0627\u0646\u0627\u062A \u0648 \u0622\u0632\u0627\u062F\u06CC\u200C\u0647\u0627\u06CC\u06CC \u06AF\u0641\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F \u06A9\u0647 \u0627\u0641\u0631\u0627\u062F \u0637\u0628\u0642 \u0642\u0627\u0646\u0648\u0646 \u0627\u0632 \u0622\u0646\u200C\u0647\u0627 \u0628\u0631\u062E\u0648\u0631\u062F\u0627\u0631\u0646\u062F. \u062F\u0648\u0644\u062A \u0628\u0627\u06CC\u062F \u0628\u0631\u0627\u06CC \u062D\u0641\u0638 \u062D\u0642\u0648\u0642 \u0645\u0631\u062F\u0645 \u0648 \u0641\u0631\u0627\u0647\u0645\u200C\u06A9\u0631\u062F\u0646 \u062E\u062F\u0645\u0627\u062A \u0639\u0645\u0648\u0645\u06CC \u062A\u0644\u0627\u0634 \u06A9\u0646\u062F."]},{id:"l4-duties",title:"\u0645\u0633\u0626\u0648\u0644\u06CC\u062A\u200C\u0647\u0627\u06CC \u0634\u0647\u0631\u0648\u0646\u062F\u0627\u0646",paragraphs:["\u0634\u0647\u0631\u0648\u0646\u062F\u0627\ 646 \u0645\u0648\u062C\u0648\u062F \u0628\u0647 \u0645\u062C\u0644\u0633 \u0627\u0631\u0627\u0626\u0647 \u0645\u06CC\u200C\u06A9\u0646\u062F.","\u0646\u0645\u0627\u06CC\u0646\u062F\u06AF\u0627\u0646 \u0645\u062C\u0644\u0633 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u0646\u062F \u062F\u0631\u0628\u0627\u0631\u0647 \u0639\u0645\u0644\u06A9\u0631\u062F \u062F\u0648\u0644\u062A \u0648 \u0648\u0632\u06CC\u0631\u0627\u0646 \u0627\u0632 \u0622\u0646\u200C\u0647\u0627 \u0633\u0624\u0627\u0644 \u06A9\u0646\u0646\u062F. \u0627\u0633\u062A\u06CC\u0636\u0627\u062D \u0646\u06CC\u0632 \u06CC\u06A9\u06CC \u0627\u0632 \u0627\u0628\u0632\u0627\u0631\u0647\u0627\u06CC \u0646\u0638\u0627\u0631\u062A\u06CC \u0645\u062C\u0644\u0633 \u0628\u0631\u0627\u06CC \u0628\u0631\u0631\u0633\u06CC \u0639\u0645\u0644\u06A9\u0631\u062F \u0648\u0632\u06CC\u0631\u0627\u0646 \u0627\u0633\u062A."]},{id:"l4-income",title:"\u062F\u0631\u0622\u0645\u062F\u0647\u0627\u06CC \u062F\u0648\u0644\u062A",paragraphs:["\u062F\u0648\u0644\u062A \u0628\u0631\u0627\u06CC \u0627\u062F\u0627\u0631\u0647 \u06A9\u0634\u0648\u0631 \u0648 \u0627\u0631\u0627\u0626\u0647 \u062E\u062F\u0645\u0627\u062A \u0639\u0645\u0648\u0645\u06CC \u0628\u0647 \u062F\u0631\u0622\u0645\u062F \u0646\u06CC\u0627\u0632 \u062F\u0627\u0631\u062F. \u0628\u062E\u0634\u06CC \u0627\u0632 \u062F\u0631\u0622\u0645\u062F \u062F\u0648\u0644\u062A \u0627\u0632 \u0641\u0631\u0648\u0634 \u0646\u0641\u062A \u0648 \u0635\u0627\u062F\u0631\u0627\u062A \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u0628\u0647 \u062F\u0633\u062A \u0645\u06CC\u200C\u0622\u06CC\u062F. \u0645\u0627\u0644\u06CC\u0627\u062A\u200C\u0647\u0627 \u0646\u06CC\u0632 \u06CC\u06A9\u06CC \u0627\u0632 \u0645\u0646\u0627\u0628\u0639 \u0645\u0647\u0645 \u062F\u0631\u0622\u0645\u062F \u062F\u0648\u0644\u062A \u0647\u0633\u062A\u0646\u062F."]},{id:"l4-expenses",title:"\u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC \u062F\u0648\u0644\u062A",paragraphs:["\u062F\u0648\u0644\u062A \u0628\u0631\u
